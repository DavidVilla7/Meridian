name: Build and deploy MeridianFix web payload

on:
  push:
    branches:
      - substrate
    paths:
      - 'Meridian/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: substrate
          path: source

      - name: Install ldid
        run: |
          brew update
          brew install ldid

      - name: Build Meridian for iOS
        working-directory: source
        run: |
          xcodebuild \
            -project Meridian/Meridian.xcodeproj \
            -scheme Meridian \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate and stage web payload
        run: |
          set -euo pipefail
          APP="source/build/Build/Products/Release-iphoneos/Meridian.app"
          EXECUTABLE="$APP/Meridian"
          test -f "$EXECUTABLE"
          python3 - "$EXECUTABLE" <<'PY'
          import pathlib, struct, sys
          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          if len(data) < 4 or struct.unpack("<I", data[:4])[0] != 0xfeedfacf:
              raise SystemExit("Build output is not a 64-bit little-endian Mach-O executable")
          print(f"Validated arm64 Mach-O candidate: {p} ({len(data)} bytes)")
          PY

      - name: Check out GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          persist-credentials: true

      - name: Deploy payload
        run: |
          set -euo pipefail
          cp source/build/Build/Products/Release-iphoneos/Meridian.app/Meridian pages/substrate/payload
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substrate/payload
          if git diff --cached --quiet; then
            echo "Payload is unchanged; nothing to deploy."
            exit 0
          fi
          git commit -m "Deploy rebuilt MeridianFix web payload"
          git push origin HEAD:gh-pages
